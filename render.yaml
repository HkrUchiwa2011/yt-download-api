services:
  - type: web
    name: yt-download-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: yt-redis
          property: connectionString
      - key: EMBEDDED_WORKERS
        value: "1"
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
      - key: MAX_FILESIZE_MB
        value: "100"
      - key: TMP_DIR
        value: /var/downloads/files
    disk:
      name: downloads
      mountPath: /var/downloads
      sizeGB: 5

  - type: keyvalue
    name: yt-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
