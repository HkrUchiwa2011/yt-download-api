services:
  redis:
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: [no-new-privileges:true]

  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      EMBEDDED_WORKERS: "0"
    volumes: [downloads:/tmp/yt-downloads]
    tmpfs: ["/tmp/runtime:uid=10001,gid=10001,mode=700"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    pids_limit: 96

  worker:
    build: .
    command: [python, -m, app.worker]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      EMBEDDED_WORKERS: "0"
      TMPDIR: /tmp/runtime
    volumes: [downloads:/tmp/yt-downloads]
    tmpfs: ["/tmp/runtime:uid=10001,gid=10001,mode=700"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
    stop_grace_period: 30s
    mem_limit: 1g
    pids_limit: 128

volumes:
  redis-data:
  downloads:
