name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    services:
      redis:
        image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.8'
          enable-cache: false
      - run: uv sync --locked --python '${{ matrix.python }}'
      - run: uv run --locked python scripts/export_requirements.py --check
      - run: uv run --locked ruff check app scripts tests
      - run: uv run --locked ruff format --check app scripts tests
      - run: uv run --locked pytest -q --ignore=tests/test_media.py --ignore=tests/test_python_runtime.py
      - run: uv run --locked pip-audit

  container:
    name: Container and native security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      redis:
        image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.8'
          enable-cache: false
      - run: uv sync --locked --python 3.13
      - run: docker build --target tests -t yt-download-api:tests .
      - run: docker run --rm --network host -e TEST_REDIS_URL=redis://127.0.0.1:6379/15 yt-download-api:tests
      - run: docker build -t yt-download-api:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: yt-download-api:ci
          scanners: vuln,secret
          format: json
          output: trivy-report.json
          exit-code: '0'
          version: v0.76.2
      - name: Check container findings
        run: uv run --locked python scripts/check_container_scan.py trivy-report.json
      - name: Watch native sources
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked python scripts/check_native_updates.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-security-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 14
